<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#0f0f11"/>
  
  <!-- Book 1 (bottom, largest) -->
  <rect x="100" y="290" width="312" height="160" rx="24" fill="#e8ff47" opacity="0.3"/>
  <rect x="100" y="290" width="312" height="160" rx="24" stroke="#e8ff47" stroke-width="8" fill="none" opacity="0.5"/>
  
  <!-- Book 2 (middle) -->
  <rect x="124" y="200" width="264" height="150" rx="20" fill="#e8ff47" opacity="0.5"/>
  <rect x="124" y="200" width="264" height="150" rx="20" stroke="#e8ff47" stroke-width="8" fill="none" opacity="0.7"/>
  
  <!-- Book 3 (top, accent) -->
  <rect x="150" y="110" width="212" height="130" rx="20" fill="#e8ff47" opacity="0.9"/>
  <rect x="150" y="110" width="212" height="130" rx="20" stroke="#e8ff47" stroke-width="8" fill="none"/>
  
  <!-- Book 3 spine -->
  <line x1="256" y1="110" x2="256" y2="240" stroke="#0f0f11" stroke-width="6" opacity="0.3"/>
  
  <!-- Book 2 spine -->
  <line x1="256" y1="200" x2="256" y2="350" stroke="#0f0f11" stroke-width="6" opacity="0.35"/>
  
  <!-- Book 1 spine -->
  <line x1="256" y1="290" x2="256" y2="450" stroke="#0f0f11" stroke-width="6" opacity="0.4"/>
  
  <!-- Page lines on top book -->
  <line x1="185" y1="150" x2="327" y2="150" stroke="#0f0f11" stroke-width="4" opacity="0.2"/>
  <line x1="185" y1="178" x2="327" y2="178" stroke="#0f0f11" stroke-width="4" opacity="0.2"/>
</svg>
