<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're offline — ClassSpace</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d12;
      color: #e8e8ed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
      text-align: center;
    }
    .logo { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: #8a8a98; margin-bottom: 24px; line-height: 1.5; }
    p span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #f59e0b; margin-right: 6px; vertical-align: middle; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .links { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 280px; }
    .links a {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px 20px; border-radius: 12px; font-size: 14px; font-weight: 600;
      text-decoration: none; transition: all 0.2s;
      background: #15151c; color: #e8e8ed; border: 1px solid #22222a;
    }
    .links a:hover { border-color: #3b82f6; background: #1a1a24; }
    .links a:active { transform: scale(0.97); }
    .note { margin-top: 24px; font-size: 12px; color: #5a5a66; }
  </style>
</head>
<body>
  <div class="logo">📚</div>
  <h1>You're offline</h1>
  <p><span></span>You're viewing cached content. Connect to the internet to post, upload, or vote.</p>
  <div class="links">
    <a href="/home">🏠 Home</a>
    <a href="/space">📢 Announcements</a>
    <a href="/timetable">📅 Timetable</a>
  </div>
  <p class="note">Your saved pages and announcements are still available</p>
</body>
</html>
