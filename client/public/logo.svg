<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Soft drop shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="4" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.15" />
    </filter>
    
    <!-- Faint glow behind books -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.08" />
      </feComponentTransfer>
    </filter>

    <!-- Cover gradients for glossy look -->
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e83636" />
      <stop offset="40%" stop-color="#d42020" />
      <stop offset="100%" stop-color="#a01010" />
    </linearGradient>
    <linearGradient id="redEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.5" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#ff6b6b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a01010" stop-opacity="0.6" />
    </linearGradient>
    
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4cd964" />
      <stop offset="40%" stop-color="#34c759" />
      <stop offset="100%" stop-color="#1a8a3a" />
    </linearGradient>
    <linearGradient id="greenEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7df78d" stop-opacity="0.5" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#7df78d" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1a8a3a" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a9eff" />
      <stop offset="40%" stop-color="#3a7bff" />
      <stop offset="100%" stop-color="#1a4fc9" />
    </linearGradient>
    <linearGradient id="blueEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8bb9ff" stop-opacity="0.5" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#8bb9ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1a4fc9" stop-opacity="0.6" />
    </linearGradient>
    
    <!-- Page gradient -->
    <linearGradient id="pageGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e8e8e0" />
    </linearGradient>
    <linearGradient id="pageSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5f5f0" />
      <stop offset="100%" stop-color="#d8d8d0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#f0efeb" rx="0" />

  <!-- Soft glow behind the stack -->
  <ellipse cx="248" cy="280" rx="130" ry="100" fill="#d0cfe8" filter="url(#glow)" />

  <!-- === BOTTOM BOOK (Blue) === -->
  <g transform="translate(248, 296)">
    <!-- Shadow -->
    <path d="M-100,10 L80,10 L105,55 L-75,55 Z" fill="none" />
    
    <!-- Page bottom edge -->
    <path d="M-95,6 L85,6 L95,26 L-85,26 Z" fill="url(#pageGrad)" stroke="#d0d0c8" stroke-width="0.5" />
    <!-- Page right edge (side view) -->
    <path d="M85,6 L95,26 L95,48 L85,28 Z" fill="url(#pageSide)" stroke="#d0d0c8" stroke-width="0.5" />
    
    <!-- Page lines on bottom -->
    <line x1="-80" y1="10" x2="88" y2="10" stroke="#d0d0c8" stroke-width="0.5" />
    <line x1="-83" y1="14" x2="90" y2="14" stroke="#d0d0c8" stroke-width="0.5" />
    <line x1="-85" y1="18" x2="93" y2="18" stroke="#d0d0c8" stroke-width="0.5" />
    <line x1="-85" y1="22" x2="95" y2="22" stroke="#d0d0c8" stroke-width="0.5" />
    
    <!-- Page lines on side -->
    <line x1="87" y1="10" x2="95" y2="26" stroke="#c8c8c0" stroke-width="0.5" />
    <line x1="89" y1="14" x2="97" y2="30" stroke="#c8c8c0" stroke-width="0.5" />
    
    <!-- Main cover -->
    <path d="M-100,-60 L80,-60 L90,-40 L-90,-40 Z" fill="url(#blueGrad)" stroke="#1a4fc9" stroke-width="1.5" filter="url(#shadow)" />
    
    <!-- Cover edge (right/bottom highlight) -->
    <path d="M-100,-60 L80,-60 L90,-40 L90,-18 L80,-38 L-100,-38 Z" fill="url(#blueEdge)" opacity="0.4" />
    
    <!-- Bright edge highlight top -->
    <path d="M-98,-59 L78,-59" stroke="#ffffff" stroke-width="1.5" opacity="0.25" fill="none" />
    
    <!-- Cover bottom edge highlight -->
    <path d="M-90,-40 L90,-40" stroke="#ffffff" stroke-width="1" opacity="0.15" fill="none" />
    
    <!-- MD initials on the blue book -->
    <text x="20" y="-22" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" fill="#ffffff" opacity="0.6" transform="skewX(-10)">MD</text>
  </g>

  <!-- === MIDDLE BOOK (Green) === -->
  <g transform="translate(236, 252)">
    <!-- Page bottom edge -->
    <path d="M-85,4 L75,4 L84,20 L-76,20 Z" fill="url(#pageGrad)" stroke="#d0d0c8" stroke-width="0.5" />
    <!-- Page right edge -->
    <path d="M75,4 L84,20 L84,38 L75,22 Z" fill="url(#pageSide)" stroke="#d0d0c8" stroke-width="0.5" />
    
    <!-- Page lines on bottom -->
    <line x1="-72" y1="8" x2="77" y2="8" stroke="#d0d0c8" stroke-width="0.5" />
    <line x1="-74" y1="12" x2="80" y2="12" stroke="#d0d0c8" stroke-width="0.5" />
    <line x1="-76" y1="16" x2="83" y2="16" stroke="#d0d0c8" stroke-width="0.5" />

    <!-- Page lines on side -->
    <line x1="77" y1="8" x2="84" y2="20" stroke="#c8c8c0" stroke-width="0.5" />
    
    <!-- Main cover -->
    <path d="M-90,-48 L70,-48 L79,-32 L-81,-32 Z" fill="url(#greenGrad)" stroke="#1a8a3a" stroke-width="1.5" filter="url(#shadow)" />
    
    <!-- Cover edge highlight -->
    <path d="M-90,-48 L70,-48 L79,-32 L79,-14 L70,-30 L-90,-30 Z" fill="url(#greenEdge)" opacity="0.4" />
    
    <!-- Bright edge highlight top -->
    <path d="M-88,-47 L68,-47" stroke="#ffffff" stroke-width="1.5" opacity="0.25" fill="none" />
    
    <!-- Cover bottom edge highlight -->
    <path d="M-81,-32 L79,-32" stroke="#ffffff" stroke-width="1" opacity="0.15" fill="none" />
  </g>

  <!-- === TOP BOOK (Red) === -->
  <g transform="translate(228, 206)">
    <!-- Page bottom edge -->
    <path d="M-80,4 L65,4 L73,18 L-72,18 Z" fill="url(#pageGrad)" stroke="#d0d0c8" stroke-width="0.5" />
    <!-- Page right edge -->
    <path d="M65,4 L73,18 L73,34 L65,20 Z" fill="url(#pageSide)" stroke="#d0d0c8" stroke-width="0.5" />
    
    <!-- Page lines on bottom -->
    <line x1="-68" y1="8" x2="67" y2="8" stroke="#d0d0c8" stroke-width="0.5" />
    <line x1="-70" y1="12" x2="70" y2="12" stroke="#d0d0c8" stroke-width="0.5" />
    <line x1="-72" y1="16" x2="72" y2="16" stroke="#d0d0c8" stroke-width="0.5" />

    <!-- Page lines on side -->
    <line x1="67" y1="8" x2="73" y2="18" stroke="#c8c8c0" stroke-width="0.5" />
    <line x1="69" y1="12" x2="75" y2="22" stroke="#c8c8c0" stroke-width="0.5" />
    
    <!-- Main cover -->
    <path d="M-85,-44 L60,-44 L68,-30 L-77,-30 Z" fill="url(#redGrad)" stroke="#a01010" stroke-width="1.5" filter="url(#shadow)" />
    
    <!-- Cover edge highlight -->
    <path d="M-85,-44 L60,-44 L68,-30 L68,-14 L60,-28 L-85,-28 Z" fill="url(#redEdge)" opacity="0.4" />
    
    <!-- Bright edge highlight top -->
    <path d="M-83,-43 L58,-43" stroke="#ffffff" stroke-width="1.5" opacity="0.35" fill="none" />
    
    <!-- Cover bottom edge highlight -->
    <path d="M-77,-30 L68,-30" stroke="#ffffff" stroke-width="1" opacity="0.2" fill="none" />
    
    <!-- Subtle reflection/gloss streak -->
    <path d="M-60,-42 L30,-42" stroke="#ffffff" stroke-width="12" opacity="0.06" fill="none" stroke-linecap="round" />
  </g>
</svg>
